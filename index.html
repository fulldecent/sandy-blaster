<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <title>Sandy Blaster</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <div class="container my-5">
        <h1>Sandy Blaster</h1>
        <nav aria-label="breadcrumb" id="breadcrumbs" class="d-none">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a class="breadcrumb-link" href="#" data-view="main">Sandy Blaster</a></li>
                <li class="breadcrumb-divider"></li>
                <li class="breadcrumb-item"><span class="breadcrumb-link active" aria-current="page">Template</span>
                </li>
            </ol>
        </nav>

        <div id="main-view">
            <div class="row row-cols-1 lg:row-cols-3 g-7">
                <!-- Contacts card -->
                <div class="col">
                    <div class="card">
                        <div class="card-header">Contacts</div>
                        <div class="card-body">
                            <p id="contacts-status">No contacts loaded</p>
                            <button id="contacts-load" class="btn-solid theme-primary">Load contacts</button>
                            <input type="file" id="contacts-upload" class="d-none" accept=".csv">
                            <button id="contacts-clear" class="btn-solid theme-danger d-none">Clear contacts</button>
                        </div>
                    </div>
                </div>

                <!-- Template card -->
                <div class="col">
                    <div id="template-card" class="card">
                        <div class="card-header">Template</div>
                        <div class="card-body">
                            <p id="template-status">Template not started</p>
                            <div class="d-flex flex-wrap gap-3">
                                <button id="template-load" class="btn-solid theme-primary">Load template</button>
                                <input type="file" id="template-upload" class="d-none" accept=".json">
                                <button id="template-edit" class="btn-solid theme-secondary">View/edit template</button>
                                <button id="template-download" class="btn-solid theme-secondary d-none">Save
                                    template</button>
                                <button id="template-clear" class="btn-solid theme-danger d-none">Clear
                                    template</button>

                            </div>

                        </div>
                    </div>
                </div>

                <!-- Sending card -->
                <div class="col">
                    <div id="sending-card" class="card">
                        <div class="card-header">Sending</div>
                        <div class="card-body">
                            <form id="sending-config">
                                <div class="mb-5">
                                    <label for="apiKey" class="form-label">Mailgun API key</label>
                                    <input type="password" class="form-control" id="apiKey" name="apiKey">
                                </div>
                                <div class="mb-5">
                                    <label for="domain" class="form-label">Mailgun domain</label>
                                    <input type="text" class="form-control" id="domain" name="domain">
                                </div>
                            </form>
                            <button id="sending-send" class="btn-solid theme-primary">Send emails</button>
                            <p id="sending-send-status" class="mt-3"></p>
                            <div id="sending-progress" class="d-none">
                                <div class="progress mb-5">
                                    <div id="sending-progress-bar" class="progress-bar" style="width: 0%"></div>
                                </div>
                                <p id="sending-eta"></p>
                                <button id="sending-pause" class="btn-solid theme-warning">Pause</button>
                                <button id="sending-stop" class="btn-solid theme-danger">Stop</button>
                            </div>
                            <button id="sending-download" class="btn-solid theme-secondary d-none">Save sending
                                report</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- View/edit template page -->
        <div id="template-view" class="d-none">
            <div class="row row-cols-1 lg:row-cols-2 g-7">
                <div class="col">
                    <h2>View/edit template</h2>
                    <div id="column-buttons" class="mb-3"></div>
                    <div class="mb-5">
                        <label for="sender_name" class="form-label">Sender name</label>
                        <div class="input-group mb-3">
                            <select class="form-control mode-select" data-field="sender_name">
                                <option value="column">Column</option>
                                <option value="handlebars">Handlebars</option>
                            </select>
                        </div>
                        <input type="text" class="form-control" id="sender_name" name="sender_name">
                    </div>
                    <div class="mb-5">
                        <label for="sender_email" class="form-label">Sender email</label>
                        <div class="input-group mb-3">
                            <select class="form-control mode-select" data-field="sender_email">
                                <option value="column">Column</option>
                                <option value="handlebars">Handlebars</option>
                            </select>
                        </div>
                        <input type="text" class="form-control" id="sender_email" name="sender_email">
                    </div>
                    <div class="mb-5">
                        <label for="subject" class="form-label">Subject</label>
                        <div class="input-group mb-3">
                            <select class="form-control mode-select" data-field="subject">
                                <option value="column">Column</option>
                                <option value="handlebars">Handlebars</option>
                            </select>
                        </div>
                        <input type="text" class="form-control" id="subject" name="subject">
                    </div>
                    <div class="mb-5">
                        <label for="recipient_name" class="form-label">Recipient name</label>
                        <div class="input-group mb-3">
                            <select class="form-control mode-select" data-field="recipient_name">
                                <option value="column">Column</option>
                                <option value="handlebars">Handlebars</option>
                            </select>
                        </div>
                        <input type="text" class="form-control" id="recipient_name" name="recipient_name">
                    </div>
                    <div class="mb-5">
                        <label for="recipient_email" class="form-label">Recipient email</label>
                        <div class="input-group mb-3">
                            <select class="form-control mode-select" data-field="recipient_email">
                                <option value="column">Column</option>
                                <option value="handlebars">Handlebars</option>
                            </select>
                        </div>
                        <input type="text" class="form-control" id="recipient_email" name="recipient_email">
                    </div>
                    <div class="mb-5">
                        <label for="recipient_cc" class="form-label">CC (carbon copy) <span
                                class="fg-secondary">(optional)</span></label>
                        <div class="input-group mb-3">
                            <select class="form-control mode-select" data-field="recipient_cc">
                                <option value="column">Column</option>
                                <option value="handlebars">Handlebars</option>
                            </select>
                        </div>
                        <input type="text" class="form-control" id="recipient_cc" name="recipient_cc">
                        <div class="form-text">Leave blank for no CC. Format: email@example.com or Name
                            &lt;email@example.com&gt;. For multiple addresses, separate with commas.</div>
                    </div>
                    <div class="mb-5">
                        <label for="template-text" class="form-label">Message</label>
                        <textarea class="form-control" id="template-text" rows="10"></textarea>
                    </div>
                </div>
                <div class="col">
                    <h2>Preview</h2>
                    <p id="contact-selector-status"></p>
                    <div class="input-group mb-3" style="max-width: 22rem;">
                        <span class="input-group-text">Contact</span>
                        <input id="contact-page-number" class="form-control" type="number" min="1" step="1"
                            style="min-width: 5rem;" aria-label="Contact number" disabled>
                        <span id="contact-page-total" class="input-group-text">of 0</span>
                        <button id="contact-random" class="input-group-btn btn-solid theme-secondary"
                            disabled>🔀</button>
                    </div>
                    <div id="preview-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
